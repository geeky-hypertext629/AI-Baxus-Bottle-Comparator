<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="bg-gray-100 w-96 h-full">
  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Ai Bottle comparator for Baxus</h1>
    
    <!-- API Key Section -->
    <div id="apiKeySection" class="mb-4">
      <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">Gemini API Key</label>
      <div class="flex">
        <input type="password" id="apiKey" class="flex-grow px-3 py-2 border border-gray-300 rounded-l-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your Gemini API Key">
        <button id="saveApiKey" class="bg-indigo-600 text-white px-4 py-2 rounded-r-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save</button>
      </div>
    </div>

    <!-- Main Content Section (hidden until API key is saved) -->
    <div id="mainContent" class="hidden">
      <!-- Summary Section -->
      <div class="mb-4">
        <button id="getSummary" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mb-2">
          Analyse Bottle and find similar on Baxus
        </button>
        <div id="summaryResult" class="bg-white p-3 rounded-md shadow-sm border border-gray-200 min-h-16 hidden">
          <h3 class="font-semibold text-gray-700 mb-1">Summary:</h3>
          <div id="summaryContent" class="text-gray-600 text-sm"></div>
        </div>
      </div>
      

      <div id="productResults" style="margin-top: 16px; display: none;">
        <h2 class="text-lg font-medium mb-2">Found Products</h2>
        <div id="productsContainer" class="border rounded p-3 bg-gray-50">
          <!-- Products will be displayed here -->
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="hidden flex justify-center items-center py-4">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
      </div>



      
      <!-- Question Section -->
      
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="text-sm text-center text-gray-600 mt-2"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
